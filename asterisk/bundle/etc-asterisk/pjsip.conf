; ==== Call Center firuzo - PJSIP (WebRTC over WSS) ====
[global]
default_outbound_endpoint=visitor

[system]
type=system
timers=t1min

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---- WebRTC template ----
[webrtc-tpl]!
type=endpoint
transport=transport-ws
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
disallow=all
allow=ulaw
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
ice_support=yes
use_avpf=yes
rtcp_mux=yes
bundle=yes
max_audio_streams=1
context=from-widget
device_state_busy_at=3

; ---- Visitor (shared account for website widget) ----
[visitor](webrtc-tpl)
auth=visitor
aors=visitor

[visitor]
type=auth
auth_type=userpass
username=visitor
password=FzVis2026!x

[visitor]
type=aor
max_contacts=30
remove_existing=no
qualify_frequency=0

; ---- Operator ext 1000 (admin console phone) ----
[1000](webrtc-tpl)
context=from-internal
auth=auth1000
aors=1000

[auth1000]
type=auth
auth_type=userpass
username=1000
password=FzOp1000!x

[1000]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

