[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/callcenter-supervisord.pid

[unix_http_server]
file=/run/callcenter-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/callcenter-supervisor.sock

[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk -vvv
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:recordings-sftp]
command=/usr/sbin/sshd -D -e -f /opt/callcenter-templates/cc_sshd_config
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
