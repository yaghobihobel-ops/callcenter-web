# ============================================================
#  callcenter-web installer configuration
#  1) cp config.example.conf my.conf
#  2) edit my.conf
#  3) sudo ./install.sh --config my.conf [--only pbx,turn,app,nginx]
#  4) sudo ./check.sh --config my.conf --full --pbx --app --nginx --turn
# Empty *_PASS values are auto-generated and saved to
# /opt/callcenter/.generated-creds (chmod 600) on the app host.
# ============================================================

# ---- Identity ----
CC_DOMAIN="call.firuzo.online"        # panel/widget hostname (public)
BRAND_NAME="فیرزو"
SUPPORT_PHONE="+982191000000"
SUPPORT_PHONE_DISPLAY="۰۲۱-۹۱۰۰۰۰۰۰"

# ---- Hosts (LAN) ----
APP_HOST="192.168.100.65"             # LAN IP of the host running backend+nginx+coturn
PBX_HOST="192.168.100.85"             # LAN IP of the Asterisk host (can be the same box)
PUBLIC_IP="46.100.58.20"              # public IP visitors reach (NAT edge for TURN)

# ---- Ports ----
APP_PORT="3006"                       # backend listen port (127.0.0.1)
PBX_WS_PORT="8088"                    # Asterisk built-in HTTP/WS port
AMI_PORT="5038"

# ---- Database (MariaDB/MySQL on the app host) ----
DB_NAME="callcenter"
DB_USER="callcenter"
DB_PASS=""                            # empty = generate

# ---- Secrets (empty = generate) ----
JWT_SECRET=""
VISITOR_SIP_PASS=""                   # pjsip [visitor] account
AMI_USER="callcenter"
AMI_PASS=""
TURN_USER="callcenter"
TURN_PASS=""
OP_SIP_PASS_PATTERN="FzOp{ext}!x"     # operator ext 1000-1005 passwords

# ---- Web admin bootstrap (created on first run if users table is empty) ----
ADMIN_USER="admin"
ADMIN_PASS="Firuzo@Admin2026"
OPERATOR_USER="operator"
OPERATOR_PASS="Firuzo@Operator2026"

# ---- TLS for nginx (panel vhost) ----
TLS_MODE="selfsigned"                 # selfsigned | existing
CERT_FILE="/etc/nginx/ssl-callcenter/call.firuzo.online.crt"
KEY_FILE="/etc/nginx/ssl-callcenter/call.firuzo.online.key"

# ---- Paths ----
INSTALL_DIR="/opt/callcenter"         # app root (backend lives in $INSTALL_DIR/app)
